# Hyprland submap activated while WoW window is focused.
# Super+1-9 are deliberately UNDEFINED here so the keystroke passes through to
# WoW (Hyprland's normal workspace-switch is suppressed only while in-game).
# Super+Tab / Super+Shift+Tab still cycle workspaces - same muscle memory as
# Alt+Tab on Windows.

submap = wow
# Workspace cycling - the only WM binds we keep active in-game
bind = SUPER, Tab, workspace, e+1
bind = SUPER SHIFT, Tab, workspace, e-1
# Safety: Escape exits submap (in case the focus listener stalls)
bind = , Escape, submap, reset
submap = reset
